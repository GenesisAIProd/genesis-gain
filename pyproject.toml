[project]
name = "genesis-gain"
version = "1.0.0"
description = "Genesis GAIN market-signal pipeline"
requires-python = ">=3.10"
dependencies = [
    "apify-client",
    "databricks-sdk",
    "mcp",
]

[project.entry-points."databricks.jobs"]
run = "genesis_gain.run_pipeline:run"

[project.scripts]
genesis-gain-run = "genesis_gain.run_pipeline:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["genesis_gain*"]
